# ---------------------------------------------------------------------------
# HRMS web -- build, push, deploy.
#
# Triggered from GitHub on changes under frontend/.
#
# The one thing to understand here: _VITE_API_URL is a BUILD argument, because
# Vite compiles it into the JavaScript and it cannot be changed afterwards.
# _BACKEND_URL is a RUNTIME variable, because it is nginx that uses it and
# Cloud Run only issues the API its URL after the API's first deploy.
#
# Nothing secret belongs in this file, and nothing secret belongs in a VITE_*
# value in any case -- every one of them is shipped to the browser in readable
# JavaScript.
# ---------------------------------------------------------------------------

substitutions:
  _REGION: asia-south1
  _REPOSITORY: hrms
  _SERVICE: hrms-frontend
  # Overridden by the trigger with $SHORT_SHA; see cloudbuild.backend.yaml.
  _TAG: manual

  # Relative on purpose. The bundle then calls whatever origin served it, and
  # nginx inside this same container forwards /api and /uploads to the backend.
  # One origin means no CORS and, critically, an httpOnly refresh cookie that
  # stays first-party. Set an absolute URL here only after reading the
  # cross-origin caveats in DEPLOYMENT.md.
  _VITE_API_URL: /api/v1

  # The API's Cloud Run URL, e.g. https://hrms-backend-abc123-el.a.run.app
  # Override this in the trigger. Left unset the container starts but every
  # /api call fails, which is the intended loud failure.
  _BACKEND_URL: http://backend-url-not-configured

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest

steps:
  # ------------------------------------------------------------------ build --
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=VITE_API_URL=${_VITE_API_URL}
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
      - -f=frontend/Dockerfile
      - frontend
    env:
      - DOCKER_BUILDKIT=1

  # ----------------------------------------------------------------- deploy --
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      # This is the public HRMS web application, so it must be reachable
      # without a Google identity.
      - --allow-unauthenticated
      # nginx serving static files is cheap; it needs far less than the API.
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      # nginx handles high concurrency comfortably, and API calls proxied
      # through it are IO-bound.
      - --concurrency=250
      - --timeout=300s
      # Runtime, not build time: nginx reads BACKEND_URL through envsubst when
      # the container starts, so the API can be repointed with a redeploy of
      # this service alone -- no rebuild of the bundle.
      - --set-env-vars=BACKEND_URL=${_BACKEND_URL},MAX_UPLOAD_SIZE=25m
      - --labels=app=hrms,component=frontend

timeout: 1200s
