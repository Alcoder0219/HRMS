# ---------------------------------------------------------------------------
# HRMS API -- build, push, deploy.
#
# Triggered from GitHub on changes under backend/ (see DEPLOYMENT.md, "GitHub
# configuration"). Nothing secret belongs in this file: it is committed to the
# repository and visible to anyone with read access. MONGODB_URI and the JWT
# secrets are attached to the Cloud Run service from Secret Manager, once, and
# are not re-specified per deploy -- see `--update-secrets` in DEPLOYMENT.md.
# ---------------------------------------------------------------------------

substitutions:
  _REGION: asia-south1
  _REPOSITORY: hrms
  _SERVICE: hrms-backend
  # The GitHub trigger overrides this with $SHORT_SHA, so every deploy is tied
  # to a commit. Deliberately not ${SHORT_SHA} here: that is empty on a
  # manually submitted build, producing an image tag ending in a bare colon.
  _TAG: manual

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest

steps:
  # ------------------------------------------------------------------ build --
  # `latest` is tagged alongside the immutable SHA tag. Deploys always reference
  # the SHA, so a rollback is a redeploy of a specific commit's image rather
  # than a guess about what `latest` pointed at last Tuesday.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      # Reuse layers from the previous image: node_modules is only reinstalled
      # when package-lock.json actually changed.
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
      - -f=backend/Dockerfile
      - backend
    env:
      - DOCKER_BUILDKIT=1

  # ----------------------------------------------------------------- deploy --
  # The `images:` block above pushes both tags; this step only deploys.
  #
  # Only non-sensitive configuration is set here. Secrets are bound to the
  # service separately and persist across deploys, so they are never printed
  # into a build log.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      # Cloud Run sends traffic to $PORT; the image defaults to 8080 and the
      # app reads process.env.PORT.
      - --port=8080
      # IAM-open, application-closed. Every route past /health sits behind the
      # app's own JWT middleware, and the browser calls this service through
      # the frontend's nginx with no Google credentials to offer. Requiring IAM
      # here would reject real users, not attackers. See DEPLOYMENT.md.
      - --allow-unauthenticated
      # Sized for ExcelJS and PDFKit, which assemble payroll exports entirely in
      # memory before writing a byte. A large salary register is the peak.
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      # Node is asynchronous and these requests are largely IO-bound on Mongo,
      # so one instance serving 80 concurrent requests is realistic and keeps
      # the instance count -- and the Atlas connection count -- down.
      - --concurrency=80
      # Long enough for a payroll run or a large export to finish.
      - --timeout=300s
      - --set-env-vars=NODE_ENV=production,LOG_TO_FILE=false,TRUST_PROXY=2
      - --labels=app=hrms,component=backend

timeout: 1200s
